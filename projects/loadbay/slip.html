<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delivery note — Loadbay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .slip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 36px;
      margin-top: 32px;
    }
    .slip-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 24px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .slip-refs {
      font-family: var(--font-mono);
      font-size: 12.5px;
      color: var(--muted);
      text-align: right;
    }
    .slip-refs div + div { margin-top: 4px; }
    .slip-refs strong { color: var(--text); font-weight: 600; }
    .slip-meta {
      display: flex;
      gap: 32px;
      margin-bottom: 28px;
      font-family: var(--font-mono);
      font-size: 13px;
      flex-wrap: wrap;
    }
    .slip-meta .lbl { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
    .plot-block { margin-bottom: 22px; }
    .plot-block h3 {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--amber);
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .sign-off {
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px dashed var(--border);
      display: flex;
      gap: 48px;
      flex-wrap: wrap;
    }
    .sign-line { flex: 1; min-width: 200px; }
    .sign-line .rule { border-bottom: 1px solid var(--muted); height: 32px; }
    .sign-line .cap { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-top: 6px; }
    .slip-actions { display: flex; gap: 12px; margin-top: 24px; }
    .btn-print {
      background: var(--surface-3);
      color: var(--text);
      border: 1px solid var(--border);
      font-family: var(--font-ui);
      font-size: 13px;
      padding: 10px 18px;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn-print:hover { border-color: var(--blue); }
    .empty-state { text-align: center; padding: 80px 20px; color: var(--muted); }
    .empty-state a { color: var(--blue); }

    @media print {
      header.topbar, .slip-actions, footer.site-footer { display: none; }
      body { background: #fff; color: #000; }
      .slip { border: none; padding: 0; }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark">L</span>
        Loadbay
      </a>
      <div class="topbar-meta">
        <span>Delivery note</span>
      </div>
    </div>
  </header>

  <div class="wrap" id="content">
    <!-- populated by JS -->
  </div>

  <script>
    const data = JSON.parse(localStorage.getItem('loadbay:lastCallOff') || 'null');
    const content = document.getElementById('content');

    if (!data) {
      content.innerHTML = `
        <div class="empty-state">
          <p>No call-off generated yet — go back to Loadbay and select plots to call off.</p>
          <p style="margin-top:12px;"><a href="index.html">← Back to Loadbay</a></p>
        </div>
      `;
    } else {
      const date = new Date(data.date);
      const dateStr = date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
      const timeStr = date.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

      const plotsHtml = data.plots.map(p => `
        <div class="plot-block">
          <h3>Plot #${p.plot} — ${p.type}</h3>
          <table class="items-table">
            <thead><tr><th>SKU</th><th>Description</th><th>Qty</th><th>Unit</th></tr></thead>
            <tbody>
              ${p.items.map(i => `
                <tr>
                  <td class="sku">${i.sku}</td>
                  <td>${i.desc}</td>
                  <td class="qty">${i.qty}</td>
                  <td>${i.unit}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `).join('');

      content.innerHTML = `
        <div class="slip">
          <div class="slip-head">
            <div>
              <div class="eyebrow">Delivery note</div>
              <h1 style="font-size:22px;">${data.deliveryNote}</h1>
            </div>
            <div class="slip-refs">
              <div>Manufacturing ref&nbsp; <strong>${data.mfgRef}</strong></div>
              <div>Order&nbsp; <strong>${data.orderRef}</strong></div>
              <div>Generated&nbsp; <strong>${dateStr}, ${timeStr}</strong></div>
            </div>
          </div>

          <div class="slip-meta">
            <div>
              <div class="lbl">Project</div>
              <div>${data.project}</div>
            </div>
            <div>
              <div class="lbl">Plots on this delivery</div>
              <div>${data.plots.map(p => '#' + p.plot).join(', ')}</div>
            </div>
          </div>

          ${plotsHtml}

          <div class="sign-off">
            <div class="sign-line">
              <div class="rule"></div>
              <div class="cap">Received by (print name)</div>
            </div>
            <div class="sign-line">
              <div class="rule"></div>
              <div class="cap">Signature &amp; date</div>
            </div>
          </div>
        </div>

        <div class="slip-actions">
          <button class="btn-print" onclick="window.print()">Print delivery note</button>
          <a href="index.html" class="btn-print" style="text-decoration:none;display:inline-flex;align-items:center;">← Back to order</a>
        </div>
      `;
    }
  </script>

  <div class="wrap">
    <footer class="site-footer">
      <span>Loadbay is a concept demo — no real orders, no real dispatch.</span>
      <a href="https://mibe.uk" class="mibe-credit" target="_blank" rel="noopener">Site concept &amp; build: MiBe</a>
    </footer>
  </div>

</body>
</html>
