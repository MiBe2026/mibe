<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mystic MiBe. — MiBe.uk</title>
  <meta name="description" content="Draw a line. We'll take it from there." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="../mibe-mark.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <script>
    // applied before first paint so the page never flashes the wrong theme
    (function () {
      if (localStorage.getItem('mibe-theme') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <style>
    /* ─── DOODLE PAGE — page-scoped, not worth putting in the shared
       stylesheet since nothing else on the site needs it ─────── */
    .doodle-hero { max-width: 900px; }
    .doodle-box {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      opacity: 0;
      animation: fade-up 0.6s ease forwards 0.55s;
    }
    .doodle-box canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .doodle-hint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .doodle-caption {
      margin-top: 20px;
      min-height: 20px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 15px;
      color: var(--orange);
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .doodle-caption.visible { opacity: 1; }
    .doodle-back {
      margin-top: 32px;
      font-family: var(--font-display);
      font-size: 13px;
      color: var(--muted);
      opacity: 0;
      animation: fade-up 0.6s ease forwards 0.7s;
    }
    .doodle-back a { color: var(--muted); }
    .doodle-back a:hover { color: var(--green); }
    .doodle-home-link {
      color: inherit;
      text-decoration: none;
    }
    .doodle-home-link:hover { text-decoration: none; }
    .card-mark-link {
      display: inline-block;
    }
  </style>
</head>
<body class="card-page">

  <!-- Custom cursor -->
  <div id="cursor"></div>
  <div id="cursor-ring"></div>

  <button class="theme-toggle card-theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light theme">🌙</button>

  <main class="card-hero doodle-hero">
    <a href="../" class="doodle-home-link card-mark-link"><img src="../mibe-mark.svg" alt="MiBe.uk mark" class="card-mark" width="56" height="40" /></a>
    <h1 class="card-title"><a href="../" class="doodle-home-link">Mystic MiBe.</a></h1>
    <p class="card-sub">Draw a doodle. This page will use science and faith to represent your TRUE thoughts.</p>

    <div class="doodle-box">
      <canvas id="doodle-canvas" width="560" height="420"></canvas>
      <p class="doodle-hint" id="doodle-hint">draw a line</p>
    </div>
    <p class="doodle-caption" id="doodle-caption"></p>

    <p class="card-footnote">Draw with a mouse, finger, or misplaced confidence.</p>
    <p class="doodle-back"><a href="../#facts">&larr; back to MiBe.uk</a></p>
  </main>

  <script>
    // ── THEME TOGGLE ───────────────────────────────────────────
    (function () {
      const STORAGE_KEY = 'mibe-theme';
      const root   = document.documentElement;
      const toggle = document.getElementById('theme-toggle');

      function reflect(theme) {
        if (theme === 'light') {
          toggle.textContent = '☀️';
          toggle.setAttribute('aria-label', 'Switch to dark theme');
        } else {
          toggle.textContent = '🌙';
          toggle.setAttribute('aria-label', 'Switch to light theme');
        }
      }

      reflect(root.getAttribute('data-theme') === 'light' ? 'light' : 'dark');

      toggle.addEventListener('click', () => {
        const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        if (next === 'light') {
          root.setAttribute('data-theme', 'light');
        } else {
          root.removeAttribute('data-theme');
        }
        localStorage.setItem(STORAGE_KEY, next);
        reflect(next);
      });
    })();

    // ── CURSOR ─────────────────────────────────────────────────
    const cursor = document.getElementById('cursor');
    const ring   = document.getElementById('cursor-ring');
    let mx = 0, my = 0, rx = 0, ry = 0;
    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      cursor.style.left = mx + 'px';
      cursor.style.top  = my + 'px';
    });
    function animateRing() {
      rx += (mx - rx) * 0.12;
      ry += (my - ry) * 0.12;
      ring.style.left = rx + 'px';
      ring.style.top  = ry + 'px';
      requestAnimationFrame(animateRing);
    }
    animateRing();

    // hide cursor on mobile
    const isTouch = 'ontouchstart' in window;
    if (isTouch) {
      cursor.style.display = 'none';
      ring.style.display   = 'none';
      document.body.style.cursor = 'auto';
    }

    // ── DOODLE ─────────────────────────────────────────────────
    // Whatever you draw morphs, point-for-point, into the same fixed
    // crude doodle every time — the joke is that it doesn't matter what
    // you drew, it was always going to end up here.
    (function () {
      const canvas  = document.getElementById('doodle-canvas');
      const ctx     = canvas.getContext('2d');
      const hint    = document.getElementById('doodle-hint');
      const caption = document.getElementById('doodle-caption');

      const CAPTIONS = [
        'Ta-da.',
        'Some things never change.',
        'You did that, not us.',
        'Groundbreaking work.',
        'Peak GCSE Food Technology energy.',
        'We should all be ashamed.',
        'A modern classic.',
        'Every single time.',
      ];

      const MIN_DRAG_PX = 30;
      const REVEAL_MS   = 2400;
      const SHOW_MS     = 1800;
      const FADE_MS     = 300;

      let state = 'idle'; // idle | drawing | revealing | shown | fading
      let points = [];
      let raf = null;
      let particles = [];

      function css(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }

      function fitCanvas() {
        const dpr  = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width  = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        render();
      }
      window.addEventListener('resize', fitCanvas);

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const t = e.touches && e.touches[0] ? e.touches[0] : e;
        return { x: t.clientX - rect.left, y: t.clientY - rect.top };
      }

      function clear() {
        const rect = canvas.getBoundingClientRect();
        ctx.clearRect(0, 0, rect.width, rect.height);
      }

      function drawRawStroke(opacity) {
        if (points.length < 2 || opacity <= 0) return;
        ctx.save();
        ctx.globalAlpha = opacity;
        ctx.strokeStyle = css('--muted');
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
        ctx.stroke();
        ctx.restore();
      }

      // ── THE SHAPE ──────────────────────────────────────────────
      // Fixed, hand-wobbly outline — same reference site's actual trick:
      // it doesn't matter what you drew or where. It always self-draws
      // the exact same crude doodle, roughly centered, ignoring your line.
      function buildShapePoints() {
        const pts = [];
        let i = 0;
        function push(x, y) {
          // deterministic "hand-drawn" wobble — fixed per point index, so
          // the doodle looks organic but is identical every time it plays
          const n1 = Math.sin(i * 12.9898) * 43758.5453;
          const n2 = Math.sin(i * 78.233) * 12543.231;
          const j1 = (n1 - Math.floor(n1) - 0.5) * 3.4;
          const j2 = (n2 - Math.floor(n2) - 0.5) * 3.4;
          pts.push({ x: x + j1, y: y + j2 });
          i++;
        }

        const shaftLen = 92, halfW = 17, ballR = 20, ballDX = -9, ballDY = 23;

        for (let s = 0; s <= 10; s++) push(shaftLen * (s / 10), -halfW);
        for (let s = 0; s <= 14; s++) {
          const a = -Math.PI / 2 + Math.PI * (s / 14);
          push(shaftLen + halfW * Math.cos(a), halfW * Math.sin(a));
        }
        for (let s = 0; s <= 10; s++) push(shaftLen * (1 - s / 10), halfW);
        for (let s = 0; s <= 20; s++) {
          const a = -0.5 + 6.0 * (s / 20);
          push(ballDX + ballR * Math.cos(a), ballDY + ballR * Math.sin(a));
        }
        for (let s = 0; s <= 20; s++) {
          const a = -0.5 + 6.0 * (s / 20);
          push(ballDX + ballR * Math.cos(a), -(ballDY + ballR * Math.sin(a)));
        }
        return pts;
      }
      const SHAPE = buildShapePoints();
      const SHAPE_BOUNDS = (() => {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        SHAPE.forEach((p) => {
          minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
          minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
        });
        return { minX, minY, maxX, maxY, w: maxX - minX, h: maxY - minY };
      })();

      // where/how big to draw the fixed shape on the current canvas —
      // recomputed per reveal so it stays centered if the box resizes
      function shapeTransform() {
        const rect = canvas.getBoundingClientRect();
        const scale = (rect.height * 0.5) / SHAPE_BOUNDS.h;
        return {
          scale,
          ox: rect.width / 2 - ((SHAPE_BOUNDS.minX + SHAPE_BOUNDS.maxX) / 2) * scale,
          oy: rect.height / 2 - ((SHAPE_BOUNDS.minY + SHAPE_BOUNDS.maxY) / 2) * scale,
        };
      }

      // draws the fixed shape up to a fraction of its full path (for the
      // self-tracing reveal), with a little pen-tip dot at the leading edge
      function drawShapePath(tf, fraction, opacity, withTip) {
        if (opacity <= 0) return;
        const segments = SHAPE.length - 1;
        const progress = Math.max(0, Math.min(1, fraction)) * segments;
        const idx = Math.floor(progress);
        const frac = progress - idx;

        ctx.save();
        ctx.globalAlpha = opacity;
        ctx.translate(tf.ox, tf.oy);
        ctx.scale(tf.scale, tf.scale);
        ctx.strokeStyle = css('--green');
        ctx.lineWidth = 3 / tf.scale;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        ctx.beginPath();
        ctx.moveTo(SHAPE[0].x, SHAPE[0].y);
        for (let s = 1; s <= idx; s++) ctx.lineTo(SHAPE[s].x, SHAPE[s].y);
        let tipX = SHAPE[idx].x, tipY = SHAPE[idx].y;
        if (idx < segments) {
          tipX = SHAPE[idx].x + (SHAPE[idx + 1].x - SHAPE[idx].x) * frac;
          tipY = SHAPE[idx].y + (SHAPE[idx + 1].y - SHAPE[idx].y) * frac;
          ctx.lineTo(tipX, tipY);
        }
        ctx.stroke();

        if (withTip && fraction < 1) {
          ctx.fillStyle = css('--green');
          ctx.beginPath();
          ctx.arc(tipX, tipY, 3.5 / tf.scale, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      // resample an arbitrary polyline to exactly n points, evenly spaced
      // by arc length, so it can be morphed point-for-point against the
      // (also n-point) target shape
      function resamplePath(pts, n) {
        const cum = [0];
        for (let i = 1; i < pts.length; i++) {
          cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
        }
        const total = cum[cum.length - 1] || 1;
        const out = [];
        let seg = 0;
        for (let i = 0; i < n; i++) {
          const target = (total * i) / (n - 1);
          while (seg < cum.length - 2 && cum[seg + 1] < target) seg++;
          const segLen = cum[seg + 1] - cum[seg] || 1;
          const localT = (target - cum[seg]) / segLen;
          const p0 = pts[seg], p1 = pts[seg + 1] || pts[seg];
          out.push({ x: p0.x + (p1.x - p0.x) * localT, y: p0.y + (p1.y - p0.y) * localT });
        }
        return out;
      }

      function easeInOutCubic(x) {
        return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
      }

      function drawMorphLine(current, opacity) {
        if (opacity <= 0) return;
        ctx.save();
        ctx.globalAlpha = opacity;
        ctx.strokeStyle = css('--green');
        ctx.lineWidth = 3;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(current[0].x, current[0].y);
        for (let i = 1; i < current.length; i++) ctx.lineTo(current[i].x, current[i].y);
        ctx.stroke();
        ctx.restore();
      }

      function spawnParticles(tf) {
        particles = [];
        const cx = tf.ox + ((SHAPE_BOUNDS.minX + SHAPE_BOUNDS.maxX) / 2) * tf.scale;
        const cy = tf.oy + ((SHAPE_BOUNDS.minY + SHAPE_BOUNDS.maxY) / 2) * tf.scale;
        const n = 14;
        for (let i = 0; i < n; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 40 + Math.random() * 90;
          particles.push({
            x: cx, y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            r: 1.5 + Math.random() * 2.5,
            color: Math.random() < 0.5 ? css('--green') : css('--orange'),
          });
        }
      }

      function drawParticles(t) {
        const dt = (REVEAL_MS * t) / 1000;
        const alpha = Math.max(0, 1 - t * 1.3);
        if (alpha <= 0) return;
        ctx.save();
        particles.forEach((p) => {
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x + p.vx * dt, p.y + p.vy * dt, p.r, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      }

      // idle/drawing render — just the live stroke as the user draws
      function render() {
        clear();
        if (state === 'drawing') drawRawStroke(1);
      }

      let lastTransform = null;

      function runReveal() {
        const tf = shapeTransform();
        lastTransform = tf;
        spawnParticles(tf);

        // morph the actual drawn line, point-for-point, into the target
        // shape — resample both to the same point count so each point of
        // what you drew has a direct partner on the shape to ease toward
        const n = SHAPE.length;
        const userPts = resamplePath(points, n);
        const targetPts = SHAPE.map((p) => ({
          x: tf.ox + p.x * tf.scale,
          y: tf.oy + p.y * tf.scale,
        }));

        const start = performance.now();
        const current = userPts.map((p) => ({ ...p }));

        function frame(now) {
          const t = Math.min(1, (now - start) / REVEAL_MS);
          const eased = easeInOutCubic(t);
          for (let i = 0; i < n; i++) {
            current[i].x = userPts[i].x + (targetPts[i].x - userPts[i].x) * eased;
            current[i].y = userPts[i].y + (targetPts[i].y - userPts[i].y) * eased;
          }

          clear();
          drawMorphLine(current, 1);
          drawParticles(t);

          if (t < 1) {
            raf = requestAnimationFrame(frame);
          } else {
            state = 'shown';
            showCaption();
            setTimeout(fadeOutAndReset, SHOW_MS);
          }
        }
        raf = requestAnimationFrame(frame);
      }

      function showCaption() {
        caption.textContent = CAPTIONS[Math.floor(Math.random() * CAPTIONS.length)];
        caption.classList.add('visible');
      }

      function fadeOutAndReset() {
        if (state !== 'shown') return;
        state = 'fading';
        caption.classList.remove('visible');

        const tf = lastTransform || shapeTransform();
        const start = performance.now();

        function frame(now) {
          const t = Math.min(1, (now - start) / FADE_MS);
          clear();
          drawShapePath(tf, 1, 1 - t, false);

          if (t < 1) {
            raf = requestAnimationFrame(frame);
          } else {
            resetToIdle();
          }
        }
        raf = requestAnimationFrame(frame);
      }

      function resetToIdle() {
        if (raf) cancelAnimationFrame(raf);
        state = 'idle';
        points = [];
        particles = [];
        clear();
        hint.style.opacity = '1';
      }

      function pointerDown(e) {
        if (state === 'shown' || state === 'fading') {
          if (raf) cancelAnimationFrame(raf);
          resetToIdle();
          return; // this click just dismisses — draw again on the next one
        }
        if (state !== 'idle') return;
        state = 'drawing';
        hint.style.opacity = '0';
        points = [getPos(e)];
        render();
      }

      function pointerMove(e) {
        if (state !== 'drawing') return;
        points.push(getPos(e));
        render();
      }

      function pointerUp() {
        if (state !== 'drawing') return;
        const p0 = points[0];
        const p1 = points[points.length - 1];
        const dist = Math.hypot(p1.x - p0.x, p1.y - p0.y);
        if (points.length < 2 || dist < MIN_DRAG_PX) {
          resetToIdle();
          return;
        }
        state = 'revealing';
        runReveal();
      }

      canvas.addEventListener('pointerdown', pointerDown);
      canvas.addEventListener('pointermove', pointerMove);
      window.addEventListener('pointerup', pointerUp);
      canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
      canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

      fitCanvas();
    })();
  </script>
</body>
</html>
